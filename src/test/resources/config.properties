# ---------- Application ----------
base.url=https://ridemate-2.onrender.com
login.path=/login
register.path=/register
protected.path=/dashboard
# Part of the URL that appears after a successful login
login.success.url.part=dashboard

# ---------- Browser ----------
browser=chrome
headless=false

# ---------- Timeouts (seconds) ----------
# Render free tier sleeps when idle, so the FIRST load can take 30-60s
page.load.timeout=90
explicit.wait=20
short.wait=3

# ---------- Test data ----------
# Use a test account you created yourself. Do NOT commit real passwords.
# You can also pass them from the command line:
#   mvn test -Dvalid.email=you@test.com -Dvalid.password=Secret@123
valid.email=testuser@example.com
valid.password=Test@12345
search.from=Nagpur
search.to=Pune
